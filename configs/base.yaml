project:
  name: mri_missing_modality
  output_root: outputs
  run_name: null   # if null, auto-generate

mode: train   # train | infer | validate --> not currently in use

seed:
  value: 42
  deterministic: false # if true, sets cudnn_deterministic to True and cudnn_benchmark to False for reproducibility

data:
  train_root: C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData
  val_root: C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData

  backend: pt_cache   # nifti | pt_cache
  train_cache_root: C:/mri_synth_2026/cache/train
  val_cache_root: C:/mri_synth_2026/cache/val

loader:
  batch_size: 2
  num_workers: 4 # can go higher on linux if needed
  shuffle: true
  pin_memory: true # can speed up dataloader
  persistent_workers: true # can speed up dataloader

patch:
  size: [128, 128, 64] #could increase this if you have room. I wouldn't worry about this as much for this run. 

model:
  name: "swin_ddpm"
  in_channels: 9          
  out_channels: 1         
  feature_size: 96        # I ran this at 72 - not compute optimal. if you need to lower this just adjust num_heads accordingly
  window_size: [4, 4, 4]  # The 5.3x VRAM saver
  depths: [2, 2, 2, 2]    # i ran this with [2, 2, 2, 2], but am curious about adding more at the third layer only. e.g. [2, 2, 4, 2] or even [2, 2, 6, 2] if VRAM allows. This sometimes helps with swin, but for mri I'm seeing [2, 2, 2, 2] a lot
  num_heads: [3, 6, 12, 24] # you want feature size / num_heads = 32 (96/3 = 32, or 64/2 = 32) for optimal performance - if you change feature size just make sure to adjust num_heads accordingly to maintain this ratio
  use_checkpoint: false    # mainly for for 16GB VRAM
  spatial_dims: 3
  drop_rate: 0.2 # could be tuned lower for better quality, but start with some regularization to stabilize training
  attn_drop_rate: 0.0

diffusion:
  timesteps: 1000
  schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: "cosine"
  t_max: 50000 # if using gradient accumulation, this should be max_steps // accumulate_grad_batches
  eta_min: 1.0e-6

augmentation:
  enabled: true
  flip_prob: 0.5
  intensity_shift_prob: 0.5
  intensity_shift_max: 0.1 # should be safe now, but still concerned about strength and exceeding valid range after shift
  rotation_prob: 0.5 # rotatio by 90 degree increments along z axis

train:
  max_steps: 100000 # if using gradient accumulation, adjust t_max in scheduler accordingly
  accumulate_grad_batches: 2 # effective batch size will be batch_size * accumulated_grad_batches
  save_every: 1000 
  log_every: 100 # also controls how often to plot metrics - consider implementing rolling average for smoother curves
  use_amp: true
  use_compile: false   # Set to false on Windows, true on Linux
  resume: # path to checkpoint or null

inference:
  checkpoint_path: null
  use_compile: false
  run_dir: "outputs/20260410_133833_swin_ddpm"
  checkpoint_name: latest.pt
  data_root: "C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"
  case_ids: [] # if empty, will run on all cases in data_root; otherwise specify list of case IDs to run
  random_case_count: 1
  random_case_seed: 42
  missing_keys: ["t2"] # e.g. ["t1", "t1ce", "t2", "flair"]
  output_subdir: inference
  save_nifti: false
  save_composite_nifti: false # saves a nifti with all channels (cond + pred)
  save_png: true
  reverse_steps: 50 # 50 seemed like the sweet spot, but may need to test higher / lower after more training

  sliding_window:
    enabled: true # not 100% yet, but I think we leave this off for swin
    roi_size: [128, 128, 64]
    sw_batch_size: 2
    overlap: 0.0

validation: # determine how often we plot metrics during training
  light_every: 1000
  heavy_every: 2000 # needed for topk checkpointing - can go higher for faster training, lower for more checkpoint oportunities
  
runtime:
  device: cuda
  cudnn_benchmark: true

metrics:
  compute_mae: true
  compute_psnr: true
  compute_ssim: true
  eval_norm: per_case_minmax
  raw_eval_norm: none   # none | per_case_minmax | global_minmax

checkpoint:
  top_k_heavy: 3

  heavy_min_progress: 0.20
  heavy_score_margin: 0.001

  heavy_min_raw_ssim: 0.08
  heavy_min_raw_psnr: 10.0
  heavy_max_raw_mae: 0.35
  heavy_max_noise_mse: 0.35

  w_ssim: 0.45
  w_psnr: 0.20
  w_mae: 0.20
  w_noise: 0.15

  rank_ssim_lo: 0.05
  rank_ssim_hi: 0.50

  rank_psnr_lo: 10.0
  rank_psnr_hi: 24.0

  rank_mae_good: 0.08
  rank_mae_bad: 0.30

  rank_noise_good: 0.03
  rank_noise_bad: 0.25

missing_policy:
  fill_value: -1.0
  use_presence_mask: true
  sampling_probs: # 0.25 seems fine for now 
    t1: 0.25
    t1ce: 0.25
    t2: 0.25
    flair: 0.25

loss:
  use_noise_mse: true
  noise_mse_weight: 1.0
  use_mae: true
  mae_weight: 1.0
  use_ssim: true
  ssim_weight: 1.0
  use_texture_loss: true # experimental, may be noisy
  texture_weight_max: 0.02 # I used this at 0.05 -> should probably test without and without it, but I think 0.02 may be good.
  texture_fade_start: 0.4
  texture_fade_end: 0.6


ema:
  enabled: true # improves quality by updating a shadow model in kept in VRAM. Should be safe unless unless the model is massive and VRAM is extremely tight
  decay: 0.9995 # determines EMA update speed; close to 1.0 means slow updates and more stable EMA weights -> I used 0.9999, but for 100k allowing it to update faster my be beneficial. 
  validate_with_ema: true
  infer_with_ema: true

control:
  stop_file: STOP