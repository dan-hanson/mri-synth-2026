project:
  name: mri_missing_modality
  output_root: outputs
  run_name: null   # if null, auto-generate

mode: infer   # train | infer

seed:
  value: 42
  deterministic: false

data:
  train_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026-main/mri-synth-2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData"
  val_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026-main/mri-synth-2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"

  backend: pt_cache   # nifti | pt_cache
  train_cache_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026-main/mri-synth-2026/cache/train"
  val_cache_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026-main/mri-synth-2026/cache/val"

loader:
  batch_size: 1
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true

patch:
  size: [128, 128, 64]

model:
  name: "swin_ddpm"
  in_channels: 9
  out_channels: 1
  feature_size: 72
  window_size: [4, 4, 4]
  depths: [2, 2, 2, 2]
  num_heads: [4, 4, 8, 16]
  use_checkpoint: true
  spatial_dims: 3
  drop_rate: 0.1
  attn_drop_rate: 0.0

diffusion:
  timesteps: 1000
  schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: "cosine"
  t_max: 35000   # roughly max_steps // accumulate_grad_batches
  eta_min: 1.0e-6

augmentation:
  enabled: true
  flip_prob: 0.5
  intensity_shift_prob: 0.5
  intensity_shift_max: 0.1
  rotation_prob: 0.5

train:
  max_steps: 70000
  accumulate_grad_batches: 2
  save_every: 1000
  log_every: 100
  use_amp: true
  use_compile: true
  resume: null

inference:
  checkpoint_path: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026-main/mri-synth-2026/outputs/20260413_111237_swin_ddpm/checkpoints/best_noise.pt"   # set this to a specific checkpoint when you switch to mode: infer
  use_compile: true
  run_dir: null           # optional alternative to checkpoint_path
  checkpoint_name: "best_noise.pt"
  data_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026-main/mri-synth-2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"
  case_ids: ["BraTS-GLI-00001-000"]
  random_case_count: 0
  random_case_seed: 42
  missing_keys: ["t1ce"]
  output_subdir: inference
  run_tag: null           # if null, infer.py auto-generates a timestamped folder
  save_nifti: false
  save_composite_nifti: false
  save_png: true
  reverse_steps: 100

  sliding_window:
    enabled: false
    roi_size: [128, 128, 64]
    sw_batch_size: 4
    overlap: 0.50

validation:
  light_every: 1000
  heavy_every: 2000

runtime:
  device: cuda
  cudnn_benchmark: true

metrics:
  compute_mae: true
  compute_psnr: true
  compute_ssim: true
  eval_norm: per_case_minmax
  raw_eval_norm: none

checkpoint:
  top_k_heavy: 3

missing_policy:
  fill_value: -1.0
  use_presence_mask: true
  sampling_probs:
    t1: 0.25
    t1ce: 0.25
    t2: 0.25
    flair: 0.25

loss:
  use_noise_mse: true
  noise_mse_weight: 1.0
  use_mae: true
  mae_weight: 1.0
  use_ssim: true
  ssim_weight: 1.0
  use_texture_loss: false
  texture_weight_max: 0.0
  texture_fade_start: 0.4
  texture_fade_end: 0.6

ema:
  enabled: true
  decay: 0.9999
  validate_with_ema: true
  infer_with_ema: true

control:
  stop_file: STOP