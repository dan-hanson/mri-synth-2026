project:
  name: mri_missing_modality
  output_root: outputs
  run_name: null   # if null, auto-generate

mode: train   # train | infer

seed:
  value: 42
  deterministic: false

data:
  train_root: C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData
  val_root: C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData

  backend: pt_cache   # nifti | pt_cache
  train_cache_root: C:/mri_synth_2026/cache/train
  val_cache_root: C:/mri_synth_2026/cache/val

loader:
  batch_size: 1
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true

patch:
  size: [80, 80, 32]

model:
  name: monai_diffusion
  in_channels: 9
  out_channels: 1

  channels: [64, 128, 256, 512]
  attention_levels: [false, false, true, true]
  num_res_blocks: 2
  num_head_channels: 32
  
  norm_num_groups: 32
  norm_eps: 1.0e-6
  resblock_updown: false
  transformer_num_layers: 1
  dropout_cattn: 0.1

diffusion:
  timesteps: 1000
  schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

optim:
  name: adamw
  lr: 0.00002
  weight_decay: 0.0001

scheduler:
  name: cosine
  t_max: 20000
  eta_min: 0.000001

augmentation:
  enabled: true
  flip_prob: 0.5
  intensity_shift_prob: 0.5
  intensity_shift_max: 0.1
  rotation_prob: 0.5
  rotation_max_deg: 15

train:
  max_steps: 20000
  accumulate_grad_batches: 4
  save_every: 250
  log_every: 100
  use_amp: true
  use_compile: false   # Set to false on Windows, true on Linux
  resume:  # path to checkpoint or null

inference:
  checkpoint_path: null
  run_dir: "outputs/20260407_023057_monai_diffusion"
  checkpoint_name: latest.pt
  data_root: "C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"
  case_ids: []
  random_case_count: 1
  random_case_seed: 42
  missing_keys: ["t1ce"]
  output_subdir: inference
  save_nifti: true
  save_composite_nifti: true
  save_png: true
  reverse_steps: 50

  sliding_window:
    enabled: true
    roi_size: [80, 80, 32]
    sw_batch_size: 4
    overlap: 0.50

validation:
  light_every: 1000
  heavy_every: 2000
  
runtime:
  device: cuda
  cudnn_benchmark: true

metrics:
  compute_mae: true
  compute_psnr: true
  compute_ssim: true
  eval_norm: per_case_minmax

missing_policy:
  fill_value: 1.0
  use_presence_mask: true
  sampling_probs:
    t1: 0.1
    t1ce: 0.4
    t2: 0.1
    flair: 0.4

loss:
  use_noise_mse: true
  noise_mse_weight: 1.0
  use_mae: true
  mae_weight: 1.0       # Lowered from 0.25 to prevent overpowering the noise MSE
  use_ssim: true       # Turned off for training to massively boost iterations/second
  ssim_weight: 1.0

ema:
  enabled: true
  decay: 0.999
  validate_with_ema: true
  infer_with_ema: true

control:
  stop_file: STOP