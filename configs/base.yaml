project:
  name: mri_missing_modality
  output_root: outputs
  run_name: embed_v5   # if null, auto-generate

mode: train   # train | infer

seed:
  value: 42
  deterministic: false

data:
  train_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData"
  val_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"

  backend: pt_cache   # nifti | pt_cache
  train_cache_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026/cache/train"
  val_cache_root: "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026/cache/val"

loader:
  batch_size: 1
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true

patch:
  size: [96, 96, 64]

model:
  name: monai_diffusion_ssim
  in_channels: 9
  out_channels: 1
  use_target_class_embed: true #enables target-modality embedding

  channels: [96, 192, 384, 512]
  attention_levels: [false, false, true, true]
  num_res_blocks: 2
  num_head_channels: 32

  norm_num_groups: 32
  norm_eps: 1.0e-6
  resblock_updown: false
  transformer_num_layers: 1
  dropout_cattn: 0.0

diffusion:
  timesteps: 1000
  schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: "constant_with_warmup" # constant_with_warmup | cosine -> if using cosine, also set warmup_steps to 0
  warmup_steps: 2500  # Ramp up over the first 2.5k steps, then hold the line
  # t_max: 50000  # Only used for cosine scheduler, ignored by constant_with_warmup
  # eta_min: 0.00001  # Only used for cosine scheduler, ignored by constant_with_warmup

augmentation:
  enabled: true
  flip_prob: 0.5
  intensity_shift_prob: 0.5
  intensity_shift_max: 0.1
  rotation_prob: 0.5
  rotation_max_deg: 15

train:
  max_steps: 60000
  accumulate_grad_batches: 4
  save_every: 1000
  log_every: 1000
  use_amp: true
  use_compile: true   # Set to false on Windows, true on Linux
  resume: null # path to checkpoint or null

inference:
  checkpoint_path: null
  use_compile: false
  run_dir: "outputs/embed_v4"
  checkpoint_name: "best_ssim.pt"
  data_root:  "/home/heron/Desktop/PROJECTS/SP-Group/mri-synth-2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"
  case_ids: ["BraTS-GLI-00001-000"]
  random_case_count: 0
  random_case_seed: 42
  missing_keys: ["t1ce", "flair"] # e.g. ["t1", "t1ce", "t2", "flair"]
  output_subdir: inference
  save_nifti: true
  save_composite_nifti: true
  save_png: true
  reverse_steps: 100
  run_name: "v5_cfg20"          # change this between runs
  cfg_guidance_scale: 2.0   # NEW — CFG inference. 1.0 disables, typical 1.5-7.5

  sliding_window:
    enabled: true
    roi_size: [96, 96, 64]
    sw_batch_size: 2
    overlap: 0.50

validation:
  light_every: 1000
  heavy_every: 3000

runtime:
  device: cuda
  cudnn_benchmark: true

metrics:
  compute_mae: true
  compute_psnr: true
  compute_ssim: true
  eval_norm: per_case_minmax

missing_policy:
  fill_value: 1.0
  use_presence_mask: true
  tumor_crop_prob: 0.5         # NEW — 50% of training crops will contain tumor
  sampling_probs:
    t1: 0.25
    t1ce: 0.25
    t2: 0.25
    flair: 0.25

loss:
  use_noise_mse: true
  noise_mse_weight: 1.0
  use_mae: true
  mae_weight: 1.0       # Lowered from 0.25 to prevent overpowering the noise MSE
  use_ssim: true       # Turned off for training to massively boost iterations/second
  ssim_weight: 1.0
  use_raw_mae: true              # NEW
  raw_mae_weight: 0.5            # NEW — unclamped intensity supervision
  tumor_weight: 3.0              # NEW — multiplier inside tumor regions
  min_snr_gamma: 0.5          # NEW — Min-SNR-γ cap for aux loss weighting
  cond_dropout_prob: 0.10     # NEW — fraction of steps where cond is dropped

ema:
  enabled: true
  decay: 0.999
  validate_with_ema: true
  infer_with_ema: true

control:
  stop_file: STOP