project:
  name: mri_missing_modality
  output_root: outputs
  run_name: null   # if null, auto-generate

mode: infer   # train | infer

seed:
  value: 42
  deterministic: false

data:
  train_root: "C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData"
  val_root: "C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"

loader:
  batch_size: 1
  num_workers: 0
  shuffle: true
  pin_memory: true

patch:
  size: [96, 96, 64]

model:
  name: unet
  in_channels: 9
  out_channels: 1
  base_ch: 16
  base_dim: 32

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine
  t_max: 50
  eta_min: 0.000001

train:
  max_steps: 60
  save_every: 50
  log_every: 10
  use_amp: true
  resume: null   # path to checkpoint or null

inference:
  checkpoint_path: null
  run_dir: "outputs/20260403_204659_unet"
  checkpoint_name: best.pt
  data_root: "C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"
  inference:
  case_ids: []
  random_case_count: 1
  random_case_seed: 42
  missing_keys: ["t1ce"]
  output_subdir: inference
  save_nifti: true
  save_png: true
  reverse_steps: 100

  sliding_window:
    enabled: true
    roi_size: [96, 96, 64]
    sw_batch_size: 1
    overlap: 0.25

validation:
  light_every: 20
  heavy_every: 40

runtime:
  device: cuda
  cudnn_benchmark: true

metrics:
  compute_mae: true
  compute_psnr: true
  compute_ssim: true
  eval_norm: per_case_minmax

missing_policy:
  fill_value: 1.0
  use_presence_mask: true

loss:
  use_noise_mse: true
  noise_mse_weight: 1.0
  use_mae: true
  mae_weight: 0.25
  use_ssim: true
  ssim_weight: 0.25

ema:
  enabled: true
  decay: 0.999
  validate_with_ema: true
  infer_with_ema: true

control:
  stop_file: STOP