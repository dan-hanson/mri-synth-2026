project:
  name: mri_missing_modality
  output_root: outputs
  run_name: null   # if null, auto-generate

mode: train   # train | infer

seed:
  value: 42
  deterministic: false

data:
  train_root: C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-TrainingData
  val_root: C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData

  backend: pt_cache   # nifti | pt_cache
  train_cache_root: C:/mri_synth_2026/cache/train
  val_cache_root: C:/mri_synth_2026/cache/val

loader:
  batch_size: 2
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true

patch:
  size: [128, 128, 64]

model:
  name: "swin_ddpm"
  in_channels: 9          
  out_channels: 1         
  feature_size: 72        # If it OOMs on Step 0, drop this to 24
  window_size: [4, 4, 4]  # The 5.3x VRAM saver
  depths: [2, 2, 2, 2]
  num_heads: [4, 4, 8, 16]
  use_checkpoint: true    # Crucial for 16GB VRAM
  spatial_dims: 3
  drop_rate: 0.2
  attn_drop_rate: 0.0

diffusion:
  timesteps: 1000
  schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: "cosine"
  t_max: 50000
  eta_min: 1.0e-6

augmentation:
  enabled: true
  flip_prob: 0.5
  intensity_shift_prob: 0.5
  intensity_shift_max: 0.1
  rotation_prob: 0.5

train:
  max_steps: 100000
  accumulate_grad_batches: 2
  save_every: 1000
  log_every: 100
  use_amp: true
  use_compile: false   # Set to false on Windows, true on Linux
  resume: # path to checkpoint or null

inference:
  checkpoint_path: null
  use_compile: false
  run_dir: "outputs/20260410_014211_swin_ddpm"
  checkpoint_name: top_heavy_step_0050000.pt
  data_root: "C:/mri_synth_2026/data/GLI/ASNR-MICCAI-BraTS2023-GLI-Challenge-ValidationData"
  case_ids: []
  random_case_count: 1
  random_case_seed: 42
  missing_keys: ["flair"] # e.g. ["t1", "t1ce", "t2", "flair"]
  output_subdir: inference
  save_nifti: true
  save_composite_nifti: true
  save_png: true
  reverse_steps: 50

  sliding_window:
    enabled: false
    roi_size: [128, 128, 64]
    sw_batch_size: 4
    overlap: 0.50

validation:
  light_every: 1000
  heavy_every: 2000
  
runtime:
  device: cuda
  cudnn_benchmark: true

metrics:
  compute_mae: true
  compute_psnr: true
  compute_ssim: true
  eval_norm: per_case_minmax
  raw_eval_norm: none   # none | per_case_minmax | global_minmax

checkpoint:
  top_k_heavy: 3

missing_policy:
  fill_value: -1.0
  use_presence_mask: true
  sampling_probs:
    t1: 0.25
    t1ce: 0.25
    t2: 0.25
    flair: 0.25

loss:
  use_noise_mse: true
  noise_mse_weight: 1.0
  use_mae: true
  mae_weight: 1.0
  use_ssim: true
  ssim_weight: 1.0
  use_texture_loss: true
  texture_weight_max: 0.05
  texture_fade_start: 0.4
  texture_fade_end: 0.6


ema:
  enabled: true
  decay: 0.9999
  validate_with_ema: true
  infer_with_ema: true

control:
  stop_file: STOP